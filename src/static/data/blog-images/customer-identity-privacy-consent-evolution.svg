<svg width="1600" height="450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <style>
      .title{font-family:'Segoe UI',Arial,sans-serif;font-size:24px;fill:#fff;font-weight:700}
      .label{font-family:'Segoe UI',Arial,sans-serif;font-size:16px;fill:#111;font-weight:700}
      .small{font-family:'Segoe UI',Arial,sans-serif;font-size:14px;fill:#111}
      .line{stroke:#2563eb;stroke-width:4}
    </style>
  </defs>
  <rect width="1600" height="450" fill="url(#bgGradient)"/>
  <g transform="translate(140,120)">
    <rect x="20" y="20" width="260" height="90" rx="18" fill="#0a48a8"/>
    <text x="150" y="82" text-anchor="middle" class="title">Consent: From Compliance to Trust</text>
  </g>

  <line x1="470" y1="165" x2="820" y2="95" class="line"/>
  <rect x="840" y="70" width="320" height="60" rx="12" fill="#fff"/>
  <text x="1000" y="105" text-anchor="middle" class="label">Transparency</text>

  <line x1="470" y1="200" x2="820" y2="200" class="line"/>
  <rect x="840" y="175" width="320" height="60" rx="12" fill="#fff"/>
  <text x="1000" y="210" text-anchor="middle" class="label">Ongoing UX</text>

  <line x1="470" y1="235" x2="820" y2="315" class="line"/>
  <rect x="840" y="290" width="320" height="60" rx="12" fill="#fff"/>
  <text x="1000" y="325" text-anchor="middle" class="label">Regulatory readiness</text>

  <rect x="1230" y="70" width="300" height="36" rx="10" fill="#e0f2fe"/>
  <text x="1380" y="95" text-anchor="middle" class="small">Opt‑in %</text>

  <rect x="1230" y="170" width="300" height="36" rx="10" fill="#e0f2fe"/>
  <text x="1380" y="195" text-anchor="middle" class="small">Churn impact</text>

  <rect x="1230" y="350" width="420" height="56" rx="12" fill="#fff"/>
  <text x="1440" y="385" text-anchor="middle" class="small">Is consent an asset or a liability for you?</text>
</svg>